<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма реєстрації</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { background: #f4f4f4; padding: 20px; width: 300px; border-radius: 5px; }
        input[type="text"] { width: 100%; padding: 8px; margin: 8px 0 15px 0; box-sizing: border-box; }
        input[type="submit"] { background: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        input[type="submit"]:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>Введіть ваші дані</h2>
    <form action="process.php" method="POST">
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" required>

        <label for="surname">Прізвище:</label>
        <input type="text" id="surname" name="surname" required>

        <input type="submit" value="Надіслати">
    </form>

</body>
</html>
